<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <title>CorporateFlix | Treinamentos</title>
</head>
<body>
    
    <nav class="sidebar">
        <div class="logo">
            <span class="brand-corp">Corporate</span><span class="brand-flix">Flix</span>
        </div>
        
        <span class="menu-label">Seus Módulos</span>
        
        <div class="nav-links">
            <a href="Bem vindo.html" target="janela" class="nav-item active">
                <span class="icon">🏠</span> Boas-Vindas
            </a>
            <a href="Aula normal.html" target="janela" class="nav-item">
                <span class="icon">▶️</span> Compliance e Segurança
            </a>
        </div>
    </nav>

    <main class="content-area">
    <iframe src="Bem vindo.html" name="janela" id="content-frame" frameborder="0" allowfullscreen></iframe>
    </main>

    <script>
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
